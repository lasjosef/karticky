<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tip Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eceef1; --card:#ffffff; --ink:#1c222b; --muted:#6c7480; --line:#dfe3e8; --soft:#f4f5f7;
    --red:#d63b3b; --blue:#2c6bd6; --yellow:#e2b11f; --green:#2b9a58; --black:#2f343b; --purple:#7a4fc9; --orange:#e2742a; --teal:#1f9aa0;
    --accent:var(--blue);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px}
  body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 110px)}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;letter-spacing:.3px;margin:4px 4px 2px;text-transform:uppercase}
  .sub{color:var(--muted);margin:0 4px 16px;font-size:15px}
  .card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.4px;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--ink);border:0;cursor:pointer}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.on{color:#fff}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .freq{font-family:"Barlow Condensed",sans-serif;font-weight:600;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.4px}
  .bigtext{font-size:23px;line-height:1.35;font-weight:600;margin:16px 0 6px;white-space:pre-wrap}
  .cue{font-size:19px;line-height:1.4;margin:16px 0 6px;color:var(--ink);white-space:pre-wrap}
  .cue small{display:block;font-family:"Barlow Condensed",sans-serif;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .hint{color:var(--muted);font-size:19px;margin:16px 0 6px}
  .note{color:var(--muted);font-size:14px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
  .note a{color:var(--accent)}
  .ask{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px}
  button.btn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;letter-spacing:.5px;text-transform:uppercase;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--soft);color:var(--ink);flex:1;min-width:0}
  button.btn.main{background:var(--ink);color:#fff}
  button.btn.yes{background:var(--green);color:#fff}
  button.btn.mid{background:var(--yellow);color:#1c222b}
  button.btn.no{background:var(--red);color:#fff}
  button.btn.small{font-size:15px;padding:9px 12px;flex:0 0 auto;border-radius:11px}
  .btns{display:flex;gap:8px;margin-top:14px}
  label.lbl{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 6px}
  label.lbl span{text-transform:none;letter-spacing:0;font-family:Barlow;font-weight:400}
  textarea,input[type=text]{width:100%;font:inherit;font-size:17px;border:0;background:var(--soft);border-radius:14px;padding:12px 14px;color:var(--ink);outline:none;resize:vertical}
  textarea:focus,input[type=text]:focus{box-shadow:0 0 0 2px var(--accent) inset}
  .seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 4px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 4px 14px}
  .progress div{height:100%;background:var(--ink);border-radius:6px;transition:width .3s}
  .empty{text-align:center;padding:36px 18px}
  .empty .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;text-transform:uppercase}
  .list .item{cursor:pointer}
  .item .t{font-weight:600;font-size:17px;margin:8px 0 2px;white-space:pre-wrap}
  .item .meta{color:var(--muted);font-size:14px}
  .ladder{display:flex;gap:3px;margin-top:10px}
  .ladder i{flex:1;height:5px;border-radius:4px;background:var(--line)}
  .ladder i.f{background:var(--ink)}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
  .toast.show{opacity:1}
  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);background:var(--card);border-radius:22px;padding:8px;display:flex;gap:6px;box-shadow:0 8px 28px rgba(20,30,50,.16);z-index:10}
  nav button{border:0;background:transparent;width:64px;height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);position:relative}
  nav button span{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  nav button.on{background:var(--ink);color:#fff}
  nav .badge{position:absolute;top:4px;right:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px}
  .status{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
  .inline-confirm{background:#fdecec;border-radius:14px;padding:12px;margin-top:10px}
  .filebtn{display:inline-block;cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--soft);border-radius:11px;padding:9px 12px;font-size:15px}
  .syncline{font-size:14px;color:var(--muted)}
  .syncline.ok{color:var(--green)} .syncline.warn{color:var(--orange)}
  @media (prefers-color-scheme: dark){
    :root{--bg:#141517;--card:#1f2125;--ink:#eef0f3;--muted:#9aa1ab;--line:#2e3137;--soft:#2a2d32;--black:#8b929c}
    button.btn.main{background:#eef0f3;color:#141517} nav button.on{background:#eef0f3;color:#141517}
    .progress div{background:#eef0f3} .ladder i.f{background:#eef0f3} .inline-confirm{background:#3a2222}
    .toast{background:#eef0f3;color:#141517}
  }
  .howto p{margin:6px 0;color:var(--ink);line-height:1.45}
  .howto table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
  .howto td{padding:5px 2px;border-bottom:1px solid var(--line)}
  .howto td:last-child{color:var(--muted);text-align:right}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav">
  <button data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="13" height="16" rx="3"/><path d="M8 3h9a3 3 0 0 1 3 3v11"/></svg><span>Today</span></button>
  <button data-tab="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></button>
  <button data-tab="all"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Cards</span></button>
  <button data-tab="how"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span>How</span></button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- frequency ladder ----------
   level 0 = 7x a week ... level 7 = 1x a year. Never switches off. */
const LEVELS = [
  {label:"7× a week",   days:1},
  {label:"3× a week",   days:2},
  {label:"1× a week",   days:7},
  {label:"3× a month",  days:10},
  {label:"1× a month",  days:30},
  {label:"Every 3 months", days:91},
  {label:"2× a year",   days:182},
  {label:"1× a year",   days:365},
];
// how many reads before "Do you remember it?" — frequent levels wait for 3 reads,
// slow levels ask every time (otherwise a monthly card would need 3 months to move)
const READS_BEFORE_CHECK = l => l <= 2 ? 3 : 1;
const PLATE = ["red","blue","yellow","green","black","purple","orange","teal"];
const DEFAULT_CATS = [
  {name:"Dating",color:"red"},{name:"Socializing",color:"blue"},{name:"Chatting",color:"yellow"},
  {name:"Books",color:"green"},{name:"Skills",color:"black"}
];

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s,n) => { const [y,m,d]=s.split("-").map(Number); const x=new Date(y,m-1,d); x.setDate(x.getDate()+n); return ymd(x); };
const nice = s => { if(!s) return ""; const t=today(); if(s<=t) return "today"; if(s===addDays(t,1)) return "tomorrow";
  const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short",year: y!==new Date().getFullYear()?"numeric":undefined}); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- storage: this device first (works offline), synced through your own Google Drive ---------- */
const CLIENT_ID="442015155431-ibljcsrig896c9ds3isod4utsbko7pbv.apps.googleusercontent.com";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}, del(k){try{localStorage.removeItem(k);}catch(e){}}};
// S.all keeps every record incl. deleted ones ({id,del:true,upd}) so a delete also reaches the other device
const S = { all:new Map(), cards:new Map(), cats:DEFAULT_CATS.slice(), catsUpd:0 };
function rebuild(){ S.cards=new Map([...S.all.values()].filter(c=>!c.del).map(c=>[c.id,c])); }
function load(){ const j=LS.get("kc_data",null); if(j){ S.all=new Map((j.items||[]).map(c=>[c.id,c])); if(j.cats&&j.cats.length){S.cats=j.cats;S.catsUpd=j.catsUpd||0;} } rebuild(); }
function persist(){ LS.set("kc_data",{items:[...S.all.values()],cats:S.cats,catsUpd:S.catsUpd}); LS.set("kc_dirty",true); syncSoon(); }
function saveCard(c){ c.upd=Date.now(); S.all.set(c.id,c); rebuild(); persist(); render(); }
function deleteCard(id){ S.all.set(id,{id,del:true,upd:Date.now()}); rebuild(); persist(); render(); }
function saveCats(){ S.catsUpd=Date.now(); persist(); render(); }

/* ---- Google Drive (scope drive.file: the app sees only its own folder "Karticky") ---- */
const API="https://www.googleapis.com/drive/v3", UP="https://www.googleapis.com/upload/drive/v3";
const FOLDER="Karticky", FILE="karticky.json";
const REDIRECT=location.origin+location.pathname;
let syncState="idle", syncErr="";
const linked=()=>LS.get("kc_linked",false);
const tok=()=>{const t=LS.get("kc_token",null);return t&&t.exp>Date.now()+60000?t.v:null;};
function oauthUrl(silent){
  const st=Math.random().toString(36).slice(2); LS.set("kc_oauth",{st,back:"#"+(U.tab||"today")});
  const q=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:REDIRECT,response_type:"token",scope:"https://www.googleapis.com/auth/drive.file",state:st,include_granted_scopes:"true"});
  if(silent) q.set("prompt","none"); else if(!linked()) q.set("prompt","consent");
  return "https://accounts.google.com/o/oauth2/v2/auth?"+q;
}
function login(){ location.href=oauthUrl(false); }
function silentLogin(){ // new token without clicking while you're signed in to Google
  const last=+(sessionStorage.getItem("kc_silent")||0); if(Date.now()-last<30*60e3) return false;
  sessionStorage.setItem("kc_silent",Date.now()); location.href=oauthUrl(true); return true;
}
function oauthReturn(){
  const h=location.hash.slice(1); if(!/(^|&)(access_token|error)=/.test(h)) return;
  const p=new URLSearchParams(h), saved=LS.get("kc_oauth",null); LS.del("kc_oauth");
  if(p.get("access_token")&&saved&&p.get("state")===saved.st){ LS.set("kc_token",{v:p.get("access_token"),exp:Date.now()+(+p.get("expires_in")||3600)*1000}); LS.set("kc_linked",true); }
  else if(/interaction_required|login_required|consent_required|account_selection_required/.test(p.get("error")||"")) syncState="needlogin";
  else { syncState="err"; syncErr=p.get("error")==="access_denied"?"You didn't allow Drive access":"Google login failed"; }
  history.replaceState(null,"",REDIRECT+((saved&&saved.back)||"#today"));
}
async function g(url,opt={}){
  const t=tok(); if(!t) throw {auth:true};
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}});
  if(r.status===401){ LS.set("kc_token",null); throw {auth:true}; }
  if(r.status===404) throw {notfound:true};
  if(!r.ok) throw new Error("Google Drive error "+r.status);
  return r;
}
async function folderId(){
  let id=LS.get("kc_folder",null); if(id) return id;
  const q=encodeURIComponent(`name = '${FOLDER}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
  const j=await (await g(`${API}/files?q=${q}&fields=files(id)`)).json();
  id=j.files&&j.files.length?j.files[0].id:(await (await g(`${API}/files?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:FOLDER,mimeType:"application/vnd.google-apps.folder"})})).json()).id;
  LS.set("kc_folder",id); return id;
}
async function findFile(fid){
  const q=encodeURIComponent(`'${fid}' in parents and name = '${FILE}' and trashed = false`);
  const j=await (await g(`${API}/files?q=${q}&fields=files(id)`)).json();
  return j.files&&j.files.length?j.files[0].id:null;
}
// merge per card: newer "upd" wins on both sides -> nothing is lost when both devices changed things offline
function merge(remote){
  let pulled=false, push=false;
  const rm=new Map((remote.items||[]).map(c=>[c.id,c]));
  for(const [id,r] of rm){ const l=S.all.get(id); if(!l||(r.upd||0)>(l.upd||0)){ S.all.set(id,r); pulled=true; } }
  for(const [id,l] of S.all){ const r=rm.get(id); if(!r||(l.upd||0)>(r.upd||0)) push=true; }
  if((remote.catsUpd||0)>S.catsUpd && remote.cats && remote.cats.length){ S.cats=remote.cats; S.catsUpd=remote.catsUpd; pulled=true; }
  else if(S.catsUpd>(remote.catsUpd||0)) push=true;
  return {pulled,push};
}
let syncing=false, lastPull=0, syncTimer=null;
function syncSoon(){ clearTimeout(syncTimer); syncTimer=setTimeout(()=>sync(false),1500); }
async function sync(interactive){
  if(!linked()&&!interactive){ syncState="local"; renderStatus(); return; }
  if(!navigator.onLine){ syncState="offline"; renderStatus(); return; }
  if(!tok()){ if(interactive) return login(); syncState="needlogin"; renderStatus(); return; }
  if(syncing) return; syncing=true; syncState="busy"; renderStatus(); lastPull=Date.now();
  try{
    let fid=await folderId(), fileId;
    try{ fileId=await findFile(fid); }catch(e){ if(e.notfound){ LS.set("kc_folder",null); fid=await folderId(); fileId=await findFile(fid); } else throw e; }
    let res={pulled:false,push:true};
    if(fileId){ const remote=await (await g(`${API}/files/${fileId}?alt=media`)).json(); res=merge(remote); }
    if(res.pulled){ rebuild(); LS.set("kc_data",{items:[...S.all.values()],cats:S.cats,catsUpd:S.catsUpd}); }
    if(res.push){
      const body=JSON.stringify({app:"karticky",v:1,items:[...S.all.values()],cats:S.cats,catsUpd:S.catsUpd});
      if(fileId) await g(`${UP}/files/${fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});
      else { const b="kc"+Math.random().toString(36).slice(2);
        await g(`${UP}/files?uploadType=multipart&fields=id`,{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},
          body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:FILE,parents:[fid],mimeType:"application/json"})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`}); }
    }
    LS.set("kc_dirty",false); LS.set("kc_lastsync",Date.now()); syncState="ok";
    if(res.pulled && !busyTyping()) render();
  }catch(e){ if(e&&e.auth) syncState="needlogin"; else { syncState="err"; syncErr=(e&&e.message)||"Sync failed"; } }
  syncing=false; renderStatus();
}
const busyTyping=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA/.test(a.tagName);};
function statusText(){
  if(!linked()) return {t:"Saved on this device only",k:"warn"};
  const dirty=LS.get("kc_dirty",false);
  return ({ok:{t:"Synced with Google Drive",k:"ok"},busy:{t:"Syncing…",k:""},offline:{t:dirty?"Offline — saved here, syncs when online":"Offline — works fine, syncs later",k:""},
    needlogin:{t:"Drive: log in again to sync",k:"warn"},err:{t:syncErr||"Sync error",k:"warn"}}[syncState])||{t:dirty?"Waiting to sync":"Google Drive",k:""};
}
function renderStatus(){ const el=document.getElementById("syncline"); if(el){ const s=statusText(); el.textContent=s.t; el.className="syncline "+s.k; }
  if(U.tab==="how" && !busyTyping()) render(); }
window.addEventListener("online",()=>sync(false));
window.addEventListener("offline",()=>{syncState="offline";renderStatus();});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return;
  if(U.tab==="today") render(); // a new day may have started
  if(linked()&&!tok()&&navigator.onLine){ silentLogin(); return; }
  if(Date.now()-lastPull>20000) sync(false); });
setInterval(()=>{ if(document.visibilityState==="visible"&&Date.now()-lastPull>110000) sync(false); },120000);

function downloadBackup(){
  const blob=new Blob([JSON.stringify({app:"karticky",v:1,items:[...S.all.values()],cats:S.cats,catsUpd:S.catsUpd},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`karticky-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(file){
  const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.items) throw 0; merge(j); rebuild(); persist(); render(); toast("Backup loaded"); }catch(e){ toast("That file isn't a Tip Cards backup"); } }; r.readAsText(file);
}

/* ---------- review logic ---------- */
function dueCards(){
  const t=today();
  return [...S.cards.values()].filter(c=>c.due<=t).sort((a,b)=> a.due<b.due?-1:a.due>b.due?1:(a.created<b.created?-1:1));
}
const isCheck = c => (c.reads||0)+1 >= READS_BEFORE_CHECK(c.level);

function markRead(c){
  const n={...c, reads:(c.reads||0)+1, lastSeen:today(), seen:(c.seen||0)+1, due:addDays(today(), LEVELS[c.level].days)};
  saveCard(n);
}
function answer(c, a){ // a: "yes" | "unsure" | "no"
  let lvl=c.level;
  if(a==="yes") lvl=Math.min(LEVELS.length-1,lvl+1);
  if(a==="unsure") lvl=Math.max(0,lvl-1);
  if(a==="no") lvl=Math.max(0,lvl-2);
  const n={...c, level:lvl, reads:0, lastSeen:today(), seen:(c.seen||0)+1, lastAnswer:a, due:addDays(today(), LEVELS[lvl].days)};
  saveCard(n);
  const moved = lvl>c.level?"↓ less often: ":lvl<c.level?"↑ more often: ":"Stays: ";
  toast(moved+LEVELS[lvl].label);
}

/* ---------- UI state ---------- */
const U = { tab: (["today","add","all","how"].includes(location.hash.slice(1))?location.hash.slice(1):"today"),
  revealed:false, doneToday:0,
  form:{cat:null,text:"",cue:"",note:"",level:0}, newCat:false, filter:null, q:"", open:null, edit:null, confirmDel:null };

const esc = s => String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const catColor = name => { const c=S.cats.find(x=>x.name===name); return `var(--${c?c.color:"black"})`; };
const chip = (name,on,attrs="") => `<button class="chip ${on?"on":""}" ${attrs} style="${on?`background:${catColor(name)}`:""}"><span class="dot" style="background:${on?"#fff":catColor(name)}"></span>${esc(name)}</button>`;
const ladder = l => `<div class="ladder">${LEVELS.map((_,i)=>`<i class="${i<=l?"f":""}"></i>`).join("")}</div>`;

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }

/* ---------- views ---------- */
function viewToday(){
  const due=dueCards();
  const total=due.length+U.doneToday;
  let h=`<h1>Today</h1><p class="sub">${due.length? `${due.length} card${due.length>1?"s":""} to go` : "All read for today"} · <span id="syncline" class="syncline ${statusText().k}">${statusText().t}</span></p>`;
  if(total) h+=`<div class="progress"><div style="width:${Math.round(U.doneToday/total*100)}%"></div></div>`;
  if(!due.length){
    const next=[...S.cards.values()].sort((a,b)=>a.due<b.due?-1:1)[0];
    h+=`<div class="card empty"><div class="big">${S.cards.size?"Done ✓":"No cards yet"}</div>
      <p class="sub" style="margin-top:8px">${S.cards.size? (next?`Next card ${nice(next.due)}.`:"") : "Heard a good line on YouTube? Add it."}</p>
      <div class="btns" style="max-width:260px;margin:14px auto 0"><button class="btn main" data-go="add">Add a card</button></div></div>`;
    return h;
  }
  const c=due[0], check=isCheck(c);
  const hasCue=!!(c.cue&&c.cue.trim());
  const hidden = (check || hasCue) && !U.revealed;
  h+=`<div class="card">
    <div class="between">${chip(c.cat,true,"disabled")}<span class="freq">${LEVELS[c.level].label}</span></div>`;
  if(hasCue) h+=`<div class="cue"><small>Situation</small>${esc(c.cue)}</div>`;
  if(hidden){
    if(!hasCue){ const w=c.text.trim().split(/\s+/); h+=`<div class="hint">${esc(w.slice(0,3).join(" "))}${w.length>3?" …":""}</div>`; }
    h+=`${check?`<div class="ask">Do you remember it? Think, then reveal.</div>`:""}
      <div class="btns"><button class="btn main" id="reveal">Show</button></div>`;
  } else {
    h+=`<div class="bigtext">${esc(c.text)}</div>`;
    if(c.note) h+=`<div class="note">${linkify(c.note)}</div>`;
    if(check){
      h+=`<div class="ask">Did you remember it?</div>
      <div class="btns"><button class="btn yes" data-ans="yes">Yes</button><button class="btn mid" data-ans="unsure">Not sure</button><button class="btn no" data-ans="no">No</button></div>`;
    } else {
      h+=`<div class="btns"><button class="btn main" id="read">Read ✓</button></div>
      <p class="status">Read it twice, or say it out loud once. Check after ${READS_BEFORE_CHECK(c.level)-(c.reads||0)-1} more read${READS_BEFORE_CHECK(c.level)-(c.reads||0)-1===1?"":"s"}.</p>`;
    }
  }
  h+=`</div>`;
  return h;
}

function formFields(f, prefix){
  return `
  <label class="lbl">Category</label>
  <div class="row">${S.cats.map(c=>chip(c.name,f.cat===c.name,`data-${prefix}cat="${esc(c.name)}"`)).join("")}
    ${prefix==="f"?`<button class="chip" id="newcatbtn">+ New</button>`:""}</div>
  ${prefix==="f"&&U.newCat?`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="newcat" placeholder="New category name"><button class="btn small main" id="newcatsave">Add</button></div>`:""}
  <label class="lbl">The line / tip</label>
  <textarea rows="3" data-${prefix}f="text" placeholder="e.g. “I'm glad I came over to talk to you.”">${esc(f.text)}</textarea>
  <label class="lbl">Situation <span>— optional, turns it into a quiz card</span></label>
  <textarea rows="2" data-${prefix}f="cue" placeholder="e.g. You want to end a chat but keep the door open">${esc(f.cue)}</textarea>
  <label class="lbl">Source / note <span>— optional</span></label>
  <input type="text" data-${prefix}f="note" value="${esc(f.note)}" placeholder="YouTube link, who said it…">
  <label class="lbl">How often</label>
  ${prefix==="f"
    ? `<div class="seg">${[0,1,2].map(l=>`<button data-flevel="${l}" class="${f.level===l?"on":""}">${["7/7","3/7","1/7"][l]}</button>`).join("")}</div>`
    : `<div class="seg" style="flex-wrap:wrap">${LEVELS.map((L,l)=>`<button data-elevel="${l}" class="${f.level===l?"on":""}" style="flex:1 0 22%">${L.label.replace(" a "," / ").replace("Every 3 months","3 mo")}</button>`).join("")}</div>`}`;
}

function viewAdd(){
  const f=U.form;
  return `<h1>New card</h1><p class="sub">Write it the way you'd actually say it.</p>
  <div class="card">${formFields(f,"f")}
    <div class="btns"><button class="btn main" id="save" ${f.text.trim()&&f.cat?"":"disabled style='opacity:.45'"}>Save card</button></div>
    ${!f.cat?`<p class="status">Pick a category first.</p>`:""}
  </div>`;
}

function viewAll(){
  let cards=[...S.cards.values()];
  if(U.filter) cards=cards.filter(c=>c.cat===U.filter);
  if(U.q) { const q=U.q.toLowerCase(); cards=cards.filter(c=>(c.text+" "+(c.cue||"")+" "+(c.note||"")).toLowerCase().includes(q)); }
  cards.sort((a,b)=>a.created<b.created?1:-1);
  const counts={}; [...S.cards.values()].forEach(c=>counts[c.cat]=(counts[c.cat]||0)+1);
  let h=`<h1>Cards</h1><p class="sub">${S.cards.size} total</p>
  <div class="row" style="margin:0 2px 10px">${chip("All",!U.filter,`data-filter=""`).replace(catColor("All"),"var(--ink)")}${S.cats.map(c=>chip(c.name+(counts[c.name]?` ${counts[c.name]}`:""),U.filter===c.name,`data-filter="${esc(c.name)}"`).replace(/var\(--black\)/g,catColor(c.name))).join("")}</div>
  <input type="text" id="search" placeholder="Search…" value="${esc(U.q)}" style="margin-bottom:12px;background:var(--card)">
  <div class="list">`;
  if(!cards.length) h+=`<div class="card empty"><p class="sub">Nothing here yet.</p></div>`;
  for(const c of cards){
    if(U.open===c.id && U.edit){
      h+=`<div class="card">${formFields(U.edit,"e")}
        <div class="btns"><button class="btn main" id="esave">Save</button><button class="btn" id="ecancel">Cancel</button></div>
        ${U.confirmDel===c.id
          ? `<div class="inline-confirm"><b>Delete this card for good?</b><div class="btns"><button class="btn no" id="edelyes">Delete</button><button class="btn" id="edelno">Keep</button></div></div>`
          : `<div class="btns"><button class="btn small" id="edel" style="color:var(--red)">Delete card</button><button class="btn small" id="enow">Show it today</button></div>`}
      </div>`;
    } else {
      h+=`<div class="card item" data-open="${c.id}">
        <div class="between"><span class="chip"><span class="dot" style="background:${catColor(c.cat)}"></span>${esc(c.cat)}</span><span class="freq">${LEVELS[c.level].label}</span></div>
        <div class="t">${esc(c.text)}</div>
        <div class="meta">${c.cue?`Situation: ${esc(c.cue)} · `:""}Next ${nice(c.due)}${c.lastAnswer?` · last: ${{yes:"remembered",unsure:"not sure",no:"forgot"}[c.lastAnswer]}`:""}</div>
        ${ladder(c.level)}
      </div>`;
    }
  }
  h+=`</div>`;
  return h;
}

function viewHow(){
  return `<h1>How it works</h1><p class="sub">Simple on purpose.</p>
  <div class="card howto"><div class="between"><b style="font-size:18px">Sync</b><span class="syncline ${statusText().k}">${statusText().t}</span></div>
    <p>Your cards live on this device, so the app works without internet. With Google Drive connected they also sync between your phone and PC (a folder “Karticky” on your Drive; the app can't see anything else there).</p>
    ${!linked()?`<div class="btns"><button class="btn main" id="glogin">Connect Google Drive</button></div>`
      :`<div class="btns"><button class="btn main" id="gsync">Sync now</button><button class="btn" id="gout">Disconnect</button></div>
        ${LS.get("kc_lastsync",0)?`<p class="status">Last sync ${new Date(LS.get("kc_lastsync",0)).toLocaleString()}</p>`:""}`}
    <div class="btns"><button class="btn small" id="bdown">Download backup</button><label class="btn small filebtn">Load backup<input type="file" id="bload" accept="application/json,.json" hidden></label></div>
  </div>
  <div class="card howto">
    <p><b>1. Add</b> a line or tip, pick a category and how often you want it: 7/7, 3/7 or 1/7 a week.</p>
    <p><b>2. Today</b> shows only the cards due today. Read it, tap <b>Read ✓</b>.</p>
    <p><b>3. Check.</b> On every 3rd read (or every read once a card is monthly or slower) the line is hidden and you get asked: <i>Do you remember it?</i></p>
    <p>&nbsp;&nbsp;Yes → one step less often &nbsp;·&nbsp; Not sure → one step more often &nbsp;·&nbsp; No → two steps more often.</p>
    <p><b>Tip:</b> fill in “Situation” and the card becomes a quiz — you see the situation and try to say the line before revealing it. That sticks much better than just re-reading.</p>
    <table>${LEVELS.map((L,i)=>`<tr><td>Step ${i+1}</td><td>${L.label}</td></tr>`).join("")}</table>
    <p style="margin-top:10px;color:var(--muted)">A card never switches off — the slowest step is once a year.</p>
  </div>
`;
}

/* ---------- render + events ---------- */
function render(){
  const app=document.getElementById("app");
  const views={today:viewToday,add:viewAdd,all:viewAll,how:viewHow};
  let h=views[U.tab]();
  const active=document.activeElement, aid=active&&(active.id||active.dataset.ff||active.dataset.ef), pos=active&&active.selectionStart;
  app.innerHTML=h;
  if(aid){ const el=document.getElementById(aid)||app.querySelector(`[data-ff="${aid}"],[data-ef="${aid}"]`); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } }
  document.querySelectorAll("nav button").forEach(b=>{ b.classList.toggle("on",b.dataset.tab===U.tab); });
  const n=dueCards().length, tb=document.querySelector('nav [data-tab="today"]');
  tb.querySelector(".badge")?.remove(); if(n&&U.tab!=="today") tb.insertAdjacentHTML("beforeend",`<span class="badge">${n}</span>`);
}
function go(tab){ U.tab=tab; U.revealed=false; U.open=null; U.edit=null; U.confirmDel=null; try{ history.replaceState(null,"","#"+tab);}catch(e){} render(); window.scrollTo(0,0); }

document.getElementById("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) go(b.dataset.tab); });

document.getElementById("app").addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open]"); if(!t) return;
  const due=dueCards()[0];
  if(t.dataset.go) return go(t.dataset.go);
  if(t.id==="reveal"){ U.revealed=true; return render(); }
  if(t.id==="read"&&due){ U.revealed=false; U.doneToday++; markRead(due); return; }
  if(t.dataset.ans&&due){ U.revealed=false; U.doneToday++; answer(due,t.dataset.ans); return; }
  // add form
  if(t.dataset.fcat!==undefined){ U.form.cat=t.dataset.fcat; return render(); }
  if(t.dataset.flevel!==undefined){ U.form.level=+t.dataset.flevel; return render(); }
  if(t.id==="newcatbtn"){ U.newCat=!U.newCat; render(); document.getElementById("newcat")?.focus(); return; }
  if(t.id==="newcatsave"){ const v=document.getElementById("newcat").value.trim(); if(!v) return;
    if(!S.cats.some(c=>c.name.toLowerCase()===v.toLowerCase())) S.cats=[...S.cats,{name:v,color:PLATE[S.cats.length%PLATE.length]}];
    U.form.cat=v; U.newCat=false; saveCats(); return; }
  if(t.id==="save"){ const f=U.form; if(!f.text.trim()||!f.cat) return;
    const c={id:uid(),cat:f.cat,text:f.text.trim(),cue:f.cue.trim(),note:f.note.trim(),level:f.level,reads:0,seen:0,created:new Date().toISOString(),due:addDays(today(),LEVELS[f.level].days)};
    U.form={cat:f.cat,text:"",cue:"",note:"",level:f.level}; saveCard(c); toast("Saved — first time "+nice(c.due)); return; }
  // list
  if(t.dataset.filter!==undefined){ U.filter=t.dataset.filter||null; return render(); }
  if(t.dataset.open){ const c=S.cards.get(t.dataset.open); U.open=c.id; U.edit={...c}; U.confirmDel=null; return render(); }
  if(t.dataset.ecat!==undefined){ U.edit.cat=t.dataset.ecat; return render(); }
  if(t.dataset.elevel!==undefined){ U.edit.level=+t.dataset.elevel; return render(); }
  if(t.id==="ecancel"){ U.open=null; U.edit=null; return render(); }
  if(t.id==="esave"){ const old=S.cards.get(U.open), e2={...U.edit,text:U.edit.text.trim(),cue:(U.edit.cue||"").trim(),note:(U.edit.note||"").trim()};
    if(!e2.text) return toast("The line can't be empty");
    if(e2.level!==old.level){ e2.reads=0; e2.due=addDays(today(),LEVELS[e2.level].days); }
    U.open=null; U.edit=null; saveCard(e2); toast("Saved"); return; }
  if(t.id==="edel"){ U.confirmDel=U.open; return render(); }
  if(t.id==="edelno"){ U.confirmDel=null; return render(); }
  if(t.id==="edelyes"){ const id=U.open; U.open=null; U.edit=null; U.confirmDel=null; deleteCard(id); toast("Deleted"); return; }
  if(t.id==="glogin"||t.id==="gsync") return sync(true);
  if(t.id==="gout"){ LS.set("kc_linked",false); LS.set("kc_token",null); LS.set("kc_folder",null); syncState="local"; return render(); }
  if(t.id==="bdown") return downloadBackup();
  if(t.id==="enow"){ const c={...S.cards.get(U.open),due:today()}; U.open=null; U.edit=null; saveCard(c); toast("It's in Today"); return; }
});

document.getElementById("app").addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.ff){ U.form[el.dataset.ff]=el.value; const s=document.getElementById("save"); if(s){ const ok=U.form.text.trim()&&U.form.cat; s.disabled=!ok; s.style.opacity=ok?1:.45; } }
  if(el.dataset.ef){ U.edit[el.dataset.ef]=el.value; }
  if(el.id==="search"){ U.q=el.value; render(); }
});
document.getElementById("app").addEventListener("change",e=>{ if(e.target.id==="bload"&&e.target.files[0]){ importBackup(e.target.files[0]); e.target.value=""; } });
document.getElementById("app").addEventListener("keydown",e=>{ if(e.target.id==="newcat"&&e.key==="Enter"){ document.getElementById("newcatsave").click(); } });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(["today","add","all","how"].includes(h)&&h!==U.tab) go(h); });

oauthReturn();
{ const h=location.hash.slice(1); if(["today","add","all","how"].includes(h)) U.tab=h; }
load(); render();
if(linked()&&!tok()&&navigator.onLine){ silentLogin()||sync(false); } else sync(false);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
