<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>Tip Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#16191d;--muted:#6b7280;--line:#e2e5ea;--soft:#f3f4f6;--know:#22a061;--again:#f0802a;--shadow:0 10px 30px rgba(20,28,40,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1c1d21;--ink:#eef0f3;--muted:#9aa1ab;--line:#2c2f35;--soft:#25272c;--shadow:0 10px 30px rgba(0,0,0,.45)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;overscroll-behavior:none}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.wrap{max-width:520px;margin:0 auto}
.cond{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.3px;margin:2px 2px 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.sub{color:var(--muted);font-size:15px;margin:2px 2px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--know)}.dot.warn{background:var(--again)}
.panel{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;letter-spacing:.5px;text-transform:uppercase;border-radius:14px;padding:14px 18px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--ink);color:var(--bg)}
.btn.full{width:100%}
.btn.small{font-size:15px;padding:9px 13px;border-radius:11px}
.link{color:#3e63dd;text-decoration:none;font-weight:600}
.muted{color:var(--muted)}
/* ---------- deck ---------- */
.deck{position:relative;height:min(60vh,500px);margin:4px 0 18px}
.tc{position:absolute;inset:0;background:var(--card);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px 22px 18px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;will-change:transform}
.tc.back1{transform:translateY(14px) scale(.95);opacity:.7}
.tc.back2{transform:translateY(28px) scale(.9);opacity:.4}
.tc .band{position:absolute;left:0;right:0;top:0;height:7px}
.tc .head{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;text-transform:uppercase;padding:6px 11px;border-radius:999px;background:var(--soft)}
.tc .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;overflow:hidden;min-height:0}
.tc,.tc *{touch-action:none}
.tc .cue{font-size:19px;line-height:1.35;color:var(--muted)}
.tc .cue b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:13px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.tc .line{font-size:26px;line-height:1.28;font-weight:700;white-space:pre-wrap}
.tc .line.long{font-size:21px}
.tc .reveal{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:600}
.tc .note{font-size:14px;color:var(--muted);word-break:break-word}
.tc .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.stamp{position:absolute;top:26px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;letter-spacing:1px;padding:4px 12px;border:4px solid;border-radius:12px;opacity:0;pointer-events:none}
.stamp.k{left:22px;color:var(--know);transform:rotate(-12deg)}
.stamp.a{right:22px;color:var(--again);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:22px}
.round{width:68px;height:68px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.round.a{color:var(--again)}.round.k{color:var(--know)}
.round.u{width:46px;height:46px;font-size:18px;color:var(--muted)}
.hintrow{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}
.done{text-align:center;padding:34px 22px}
.done .big{font-size:54px}
.done h2{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-size:28px;margin:8px 0 4px}
.stats{display:flex;gap:10px;margin:18px 0}
.stat{flex:1;background:var(--soft);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:26px}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* ---------- add ---------- */
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;border:0;background:var(--soft);border-radius:16px;padding:14px 16px;color:var(--ink);outline:none;resize:none}
textarea.hero{font-size:22px;font-weight:600;min-height:130px;background:var(--card);box-shadow:var(--shadow);border-radius:22px;padding:18px 20px}
textarea:focus,input[type=text]:focus{box-shadow:0 0 0 2px #3e63dd inset}
.lab{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px;display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:9px 13px;border-radius:999px;background:var(--card);font-weight:600;font-size:15px;border:2px solid transparent}
.chip.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 14%,var(--card))}
.intent{display:flex;gap:8px}
.intent button{flex:1;background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;border:2px solid transparent;font-weight:600;font-size:14px}
.intent button span{display:block;font-size:22px;margin-bottom:2px}
.intent button.on{border-color:var(--ink)}
.more{color:#3e63dd;font-weight:600;padding:12px 4px}
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 92px);margin-top:18px}
.shared{background:var(--card);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:10px;word-break:break-all}
/* ---------- library ---------- */
.search{background:var(--card)!important;margin-bottom:10px}
.item{background:var(--card);border-radius:18px;padding:14px 16px 14px 18px;margin-bottom:10px;position:relative;overflow:hidden;cursor:pointer}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.item .t{font-weight:600;font-size:17px;line-height:1.3;white-space:pre-wrap}
.item .m{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}.item .m span:last-child{white-space:nowrap}
.lv{display:inline-flex;gap:3px;vertical-align:middle}
.lv i{width:6px;height:6px;border-radius:50%;background:var(--line)}.lv i.f{background:var(--c)}
.confirm{background:color-mix(in srgb,var(--again) 14%,var(--card));border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
/* ---------- settings ---------- */
.set h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.4px;font-size:19px;margin:0 0 8px}
.set p{margin:6px 0;line-height:1.45}
.me{display:flex;align-items:center;gap:12px}
.me img,.me .av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700}
.step{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.step.ok .n{background:var(--know)}
code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:14px}
/* ---------- login ---------- */
.login{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.login .logo{width:92px;height:92px;border-radius:26px;margin:0 auto 8px;box-shadow:var(--shadow)}
.login h1{font-size:40px}
.login .sub{font-size:17px;margin-bottom:22px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:16px;font-weight:700;font-size:17px;width:100%}
.fine{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
/* ---------- nav / toast ---------- */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);background:var(--card);border-radius:24px;padding:8px;display:flex;gap:4px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:10}
nav button{width:62px;height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);position:relative}
nav button span{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
nav button.on{color:var(--ink)}
nav button.plus{width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--bg);margin:0 4px}
nav .badge{position:absolute;top:3px;right:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav" class="hidden">
  <button data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 2.5h8a3 3 0 0 1 3 3v12"/></svg><span>Cards</span></button>
  <button data-tab="lib"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Library</span></button>
  <button data-tab="add" class="plus" aria-label="Add a card"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="set"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span>Notify</span></button>
  <button data-tab="me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Me</span></button>
</nav>
<div class="toast" id="toast"></div>
<script src="core.js"></script>
<script>
/* ================= Google sign-in + Drive (your own Drive, folder "Karticky") ================= */
const CLIENT_ID="442015155431-ibljcsrig896c9ds3isod4utsbko7pbv.apps.googleusercontent.com";
const API="https://www.googleapis.com/drive/v3", UP="https://www.googleapis.com/upload/drive/v3";
const FOLDER="Karticky", FILE="karticky.json", REPO="lasjosef/karticky";
const REDIRECT=location.origin+location.pathname;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const linked=()=>LS.get("kc_linked",false);
const tok=()=>{const t=LS.get("kc_token",null);return t&&t.exp>Date.now()+60000?t.v:null;};
function oauthUrl(silent){
  const st=Math.random().toString(36).slice(2); LS.set("kc_oauth",{st,back:"#"+U.tab});
  const q=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:REDIRECT,response_type:"token",scope:"https://www.googleapis.com/auth/drive.file",state:st,include_granted_scopes:"true"});
  if(silent) q.set("prompt","none"); else q.set("prompt","select_account");
  return "https://accounts.google.com/o/oauth2/v2/auth?"+q;
}
function login(){ location.href=oauthUrl(false); }
function silentLogin(){ const last=+(sessionStorage.getItem("kc_silent")||0); if(Date.now()-last<30*60e3) return false; sessionStorage.setItem("kc_silent",Date.now()); location.href=oauthUrl(true); return true; }
let syncState="idle", syncErr="";
function oauthReturn(){
  const h=location.hash.slice(1); if(!/(^|&)(access_token|error)=/.test(h)) return;
  const p=new URLSearchParams(h), saved=LS.get("kc_oauth",null); LS.del("kc_oauth");
  if(p.get("access_token")&&saved&&p.get("state")===saved.st){ LS.set("kc_token",{v:p.get("access_token"),exp:Date.now()+(+p.get("expires_in")||3600)*1000}); LS.set("kc_linked",true); }
  else if(/interaction_required|login_required|consent_required|account_selection_required/.test(p.get("error")||"")) syncState="needlogin";
  else { syncState="err"; syncErr=p.get("error")==="access_denied"?"You didn't allow Google Drive":"Google sign-in failed"; }
  history.replaceState(null,"",REDIRECT+((saved&&saved.back)||"#today"));
}
async function g(url,opt={}){
  const t=tok(); if(!t) throw {auth:true};
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}});
  if(r.status===401){ LS.set("kc_token",null); throw {auth:true}; }
  if(r.status===404) throw {notfound:true};
  if(!r.ok) throw new Error("Google Drive error "+r.status);
  return r;
}
async function folderId(){
  let id=LS.get("kc_folder",null); if(id) return id;
  const q=encodeURIComponent(`name = '${FOLDER}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
  const j=await (await g(`${API}/files?q=${q}&fields=files(id)`)).json();
  id=j.files&&j.files.length?j.files[0].id:(await (await g(`${API}/files?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:FOLDER,mimeType:"application/vnd.google-apps.folder"})})).json()).id;
  LS.set("kc_folder",id); return id;
}
async function findFile(fid){
  const q=encodeURIComponent(`'${fid}' in parents and name = '${FILE}' and trashed = false`);
  const j=await (await g(`${API}/files?q=${q}&fields=files(id)`)).json();
  return j.files&&j.files.length?j.files[0].id:null;
}
let syncing=false, lastPull=0, syncTimer=null, meChecked=false;
function syncSoon(){ clearTimeout(syncTimer); syncTimer=setTimeout(()=>sync(),1200); }
async function sync(){
  if(!linked()) return;
  if(!navigator.onLine){ syncState="offline"; return statusChanged(); }
  if(!tok()){ syncState="needlogin"; return statusChanged(); }
  if(syncing) return; syncing=true; syncState="busy"; statusChanged(); lastPull=Date.now();
  try{
    if(!meChecked){ // one account per device: switching account starts from that account's own data
      const me=(await (await g(`${API}/about?fields=user(emailAddress,displayName,photoLink)`)).json()).user||{};
      const owner=await DB.get("owner");
      if(owner&&me.emailAddress&&owner!==me.emailAddress){ await DB.set("data",emptyData()); S=emptyData(); LS.set("kc_folder",null); U.queue=null; }
      if(me.emailAddress) await DB.set("owner",me.emailAddress);
      LS.set("kc_me",me); meChecked=true;
    }
    let fid=await folderId(), fileId;
    try{ fileId=await findFile(fid); }catch(e){ if(e.notfound){ LS.set("kc_folder",null); fid=await folderId(); fileId=await findFile(fid); } else throw e; }
    const remote=fileId?await (await g(`${API}/files/${fileId}?alt=media`)).json():null;
    const local=await DB.get("data")||emptyData();
    const merged=mergeData(local,remote);
    if(sig(merged)!==sig(local)){ await DB.set("data",merged); S=merged; purgeStarter(); if(!busy()) render(); }
    if(!remote||sig(merged)!==sig(remote)){
      const body=JSON.stringify({app:"karticky",v:2,...merged});
      if(fileId) await g(`${UP}/files/${fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});
      else { const b="kc"+Math.random().toString(36).slice(2);
        await g(`${UP}/files?uploadType=multipart&fields=id`,{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},
          body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:FILE,parents:[fid],mimeType:"application/json"})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`}); }
    }
    LS.set("kc_lastsync",Date.now()); syncState="ok";
  }catch(e){ if(e&&e.auth) syncState="needlogin"; else { syncState="err"; syncErr=(e&&e.message)||"Sync failed"; } }
  syncing=false; statusChanged();
}
function statusChanged(){ const el=document.getElementById("syncdot"); if(el){ const s=statusInfo(); el.className="dot "+s.k; el.title=s.t; } if(U.tab==="me"&&!busy()) render(); }
function statusInfo(){ return ({ok:{t:"Synced",k:"ok"},busy:{t:"Syncing…",k:""},offline:{t:"Offline – saved on this device, syncs later",k:""},needlogin:{t:"Sign in again to sync",k:"warn"},err:{t:syncErr||"Sync error",k:"warn"}}[syncState])||{t:"",k:""}; }
window.addEventListener("online",()=>sync());
window.addEventListener("offline",()=>{syncState="offline";statusChanged();});
document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState!=="visible"||!linked()) return;
  await reloadLocal();
  if(!tok()&&navigator.onLine){ if(silentLogin()) return; }
  if(Date.now()-lastPull>20000) sync(); });
setInterval(()=>{ if(document.visibilityState==="visible"&&Date.now()-lastPull>110000) sync(); },120000);

/* ================= local data ================= */
let S=emptyData();
const cats=()=>S.cats&&S.cats.length?S.cats:DEFAULT_CATS;
const catOf=id=>cats().find(c=>c.id===id)||{id:"other",name:"Other",emoji:"✨",color:"#8b8d98"};
const live=()=>S.items.filter(c=>!c.del);
let writing=Promise.resolve();
function persist(){ // merge with what the notification may have changed meanwhile, then save + sync
  writing=writing.then(async()=>{ const cur=await DB.get("data"); S=mergeData(cur,S); await DB.set("data",S); }).catch(()=>{});
  syncSoon(); return writing;
}
function saveCard(c){ c.upd=Date.now(); S.items=S.items.filter(x=>x.id!==c.id).concat([c]); return persist(); }
function deleteCard(id){ S.items=S.items.filter(x=>x.id!==id).concat([{id,del:true,upd:Date.now()}]); return persist(); }
function saveCats(){ S.catsUpd=Date.now(); return persist(); }
function savePush(){ S.pushUpd=Date.now(); return persist(); }
async function reloadLocal(){ const cur=await DB.get("data"); const m=mergeData(S,cur); if(sig(m)!==sig(S)){ S=m; if(!busy()) render(); } }
navigator.serviceWorker&&navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.reload) reloadLocal(); });

/* ================= auto category from the words you type (EN / CZ / PL) ================= */
const KEYS={
  openers:["hi ","hey","hello","excuse me","nice to meet","approach","introduce","first time here","ahoj","čau","cześć","dobrý den","goodbye","leave","grab a drink","gotta go"],
  flirt:["cute","beautiful","gorgeous","date","kiss","flirt","attractive","sexy","your number","girlfriend","boyfriend","crush","rande","randka","holk","dziewczyn","pretty"],
  banter:["joke","funny","tease","teasing","haha","lol","sarcas","laugh","troll","comeback","roast"],
  deep:["what makes you","dream","meaning","proud","biggest","favorite","favourite","looking forward","why do you","passion","what would you","if you could"],
  stories:["story","stories","happened","when i was","once ","punchline","twist"],
  listen:["listen","sounds like","tell me more","feel","understand","empath","so you","interrupt","follow-up","follow up"],
  confidence:["confiden","mindset","fear","rejection","believe","posture","eye contact","nervous","anxious","shy","sebevědom","pewnoś","voice","slow down"],
  texting:["text","message","reply","emoji","dm","whatsapp","instagram","snap","messenger","zpráv","wiadomo","sms"],
  work:["boss","meeting","salary","negotiat","client","customer","colleague","price","deal","interview","manager","raise","šéf","zákazník","klient","szef"],
  books:["book","chapter","author","kniha","książk","podcast","video said","according to"]
};
function guessCat(text){ const t=" "+text.toLowerCase()+" "; let best=null,score=0;
  for(const [id,words] of Object.entries(KEYS)){ const s=words.reduce((n,w)=>n+(t.includes(w)?1:0),0); if(s>score){score=s;best=id;} }
  if(!best&&text.trim().endsWith("?")) best="deep";

const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));
let mySub=null;
async function refreshSub(){ try{ const r=await navigator.serviceWorker.ready; mySub=await r.pushManager.getSubscription(); }catch(e){ mySub=null; } }
async function turnOnPush(){
  if(!("Notification" in window)||!("serviceWorker" in navigator)) return toast("This browser can't show notifications");
  const perm=await Notification.requestPermission(); if(perm!=="granted") return toast("Notifications are blocked for this site");
  let P=S.push||{};
  if(!P.publicKey){ const kp=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
    P={...P,publicKey:b64u(await crypto.subtle.exportKey("raw",kp.publicKey)),privateKey:(await crypto.subtle.exportKey("jwk",kp.privateKey)).d,subs:P.subs||[]}; }
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unb64u(P.publicKey)});
  const j=sub.toJSON(); const subs=(P.subs||[]).filter(s=>s.endpoint!==j.endpoint); subs.push({endpoint:j.endpoint,keys:j.keys,device:/Android|iPhone/i.test(navigator.userAgent)?"phone":"computer"});
  S.push={...P,subs,secretSet:false}; mySub=sub; await savePush(); render(); toast("Notifications on for this device");
}
async function turnOffPush(){
  await refreshSub(); if(mySub){ const ep=mySub.endpoint; try{ await mySub.unsubscribe(); }catch(e){} S.push={...S.push,subs:(S.push.subs||[]).filter(s=>s.endpoint!==ep),secretSet:false}; await savePush(); }
  mySub=null; render(); toast("Notifications off for this device");
}

function go(tab){ if(!TABS.includes(tab)) tab="today"; U.tab=tab; U.open=null; U.edit=null; U.confirm=null; U.confirmOut=false; U.revealed=false;
  if(tab==="today") U.queue=U.queue&&U.practice?U.queue:null; try{history.replaceState(null,"",REDIRECT+"#"+tab);}catch(e){}

/* ---------- swiping ---------- */
let dragging=false;
function answerTop(know){
  const list=currentCards(); if(!list.length) return; const c=list[0];
  U.undo={...c}; const n=swipeCard(c,know,U.practice); U.done++; U.revealed=false;
  U.queue=U.queue.filter(id=>id!==c.id);
  if(!know&&!U.retry.has(c.id)){ U.retry.add(c.id); U.queue.push(c.id); } // one more try at the end of today's stack
  saveCard(n); render();
}
function flyOut(know){ const el=document.getElementById("top"); if(!el) return answerTop(know);
  el.style.transition="transform .28s ease-in, opacity .28s"; el.style.transform=`translateX(${know?140:-140}%) rotate(${know?24:-24}deg)`; el.style.opacity="0";
  setTimeout(()=>answerTop(know),230); }
function bindDeck(){
  const el=document.getElementById("top"); if(!el) return;
  let x0=0,y0=0,dx=0,dy=0,id=null,moved=false,t0=0;
  const sk=el.querySelector("#sk"), sa=el.querySelector("#sa");
  const reset=()=>{ el.style.transition="transform .25s"; el.style.transform=""; sk.style.opacity=0; sa.style.opacity=0; };
  el.addEventListener("pointerdown",e=>{ if(e.target.closest("a")||(e.pointerType==="mouse"&&e.button!==0)) return;
    id=e.pointerId; x0=e.clientX; y0=e.clientY; dx=dy=0; moved=false; t0=Date.now(); dragging=true;
    try{ el.setPointerCapture(id); }catch(err){} el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(e.pointerId!==id) return; e.preventDefault();
    dx=e.clientX-x0; dy=e.clientY-y0; if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true;
    el.style.transform=`translate(${dx}px,${dy*0.15}px) rotate(${dx/18}deg)`;
    sk.style.opacity=Math.max(0,Math.min(1,dx/80)); sa.style.opacity=Math.max(0,Math.min(1,-dx/80)); });
  el.addEventListener("pointerup",e=>{ if(e.pointerId!==id) return; id=null; dragging=false;
    const fast=Math.abs(dx)>40&&Date.now()-t0<250; // a quick flick counts too
    if(Math.abs(dx)>80||fast){ flyOut(dx>0); return; }
    reset(); if(!moved){ U.revealed=!U.revealed; render(); } });
  el.addEventListener("pointercancel",e=>{ if(e.pointerId!==id) return; id=null; dragging=false; reset(); });
}
document.addEventListener("keydown",e=>{ if(U.tab!=="today"||busy()) return;
  if(e.key==="ArrowRight") flyOut(true); else if(e.key==="ArrowLeft") flyOut(false); else if(e.key===" "){ e.preventDefault(); U.revealed=!U.revealed; render(); } });

document.getElementById("app").addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-open]"); if(!t) return; const id=t.id;
  if(id==="glogin"||id==="relogin") return login();
  if(t.dataset.go) return go(t.dataset.go);
  if(id==="know") return flyOut(true);
  if(id==="again") return flyOut(false);
  if(id==="undo"&&U.undo){ const c={...U.undo}; U.undo=null; U.queue=[c.id,...(U.queue||[]).filter(x=>x!==c.id)]; U.done=Math.max(0,U.done-1); if(c.due>today()) U.retry.add(c.id); saveCard(c); render(); return; }
  if(id==="practice"){ const all=live().sort(()=>Math.random()-.5).slice(0,10); U.queue=all.map(c=>c.id); U.practice=true; U.retry=new Set(); render(); return; }
  // add
  if(t.dataset.acat){ U.add.cat=t.dataset.acat; U.add.auto=false; return render(); }
  if(t.dataset.intent!==undefined){ U.add.intent=+t.dataset.intent; return render(); }
  if(id==="amore"){ U.add.more=true; render(); document.getElementById("acue")?.focus(); return; }
  if(id==="asave") return saveNew();
  // library
  if(t.dataset.filter!==undefined){ U.filter=t.dataset.filter||null; return render(); }
  if(t.dataset.open){ const c=S.items.find(x=>x.id===t.dataset.open); U.open=c.id; U.edit={...c}; U.confirm=null; return render(); }
  if(t.dataset.ecat){ U.edit.cat=t.dataset.ecat; return render(); }
  if(id==="ecancel"){ U.open=U.edit=null; return render(); }
  if(id==="esave"){ const old=S.items.find(x=>x.id===U.open), e2={...U.edit,text:U.edit.text.trim(),cue:(U.edit.cue||"").trim(),note:(U.edit.note||"").trim()};
    if(!e2.text) return toast("The line can't be empty");
    if((e2.level||0)!==(old.level||0)) e2.due=addDays(today(),LEVELS[e2.level]);
    U.open=U.edit=null; saveCard(e2); render(); return toast("Saved"); }
  if(id==="edel"){ U.confirm=U.open; return render(); }
  if(id==="edelno"){ U.confirm=null; return render(); }
  if(id==="edelyes"){ const x=U.open; U.open=U.edit=U.confirm=null; deleteCard(x); render(); return toast("Deleted"); }
  if(id==="enow"){ const c={...S.items.find(x=>x.id===U.open),due:today()}; U.open=U.edit=null; U.queue=null; saveCard(c); render(); return toast("It's in today's cards"); }
  // notifications
  if(id==="pon") return turnOnPush().catch(err=>toast("Couldn't turn on: "+err.message));
  if(id==="poff") return turnOffPush();
  if(id==="ptest"){ const r=await navigator.serviceWorker.ready; r.active&&r.active.postMessage({showCard:true}); return toast("Look at your notifications"); }
  if(id==="pcopy"){ try{ await navigator.clipboard.writeText(pushConfig()); toast("Key copied – paste it on GitHub"); }catch(err){ toast("Copy failed"); } return; }
  if(id==="pdone"){ S.push={...S.push,secretSet:true}; await savePush(); render(); return toast("All set – cards will come to you"); }
  if(id==="pundo"){ S.push={...S.push,secretSet:false}; await savePush(); return render(); }
  // me
  if(id==="syncnow") return sync();
  if(id==="signout"){ U.confirmOut=true; return render(); }
  if(id==="outno"){ U.confirmOut=false; return render(); }
  if(id==="outyes"){ await turnOffPush().catch(()=>{}); ["kc_linked","kc_token","kc_folder","kc_me","kc_lastsync"].forEach(k=>LS.del(k)); await DB.set("data",emptyData()); await DB.del("owner"); S=emptyData(); U.queue=null; meChecked=false; U.confirmOut=false; render(); return; }
  if(id==="bdown"){ const blob=new Blob([JSON.stringify({app:"karticky",v:2,...S},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`tip-cards-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); return; }
});
document.getElementById("app").addEventListener("input",e=>{ const el=e.target;
  if(el.id==="atext"){ U.add.text=el.value; if(U.add.auto){ const gc=guessCat(el.value); if(gc&&gc!==U.add.cat){ U.add.cat=gc; render(); return; } }
    const s=document.getElementById("asave"); if(s){ const ok=!!el.value.trim(); s.disabled=!ok; s.style.opacity=ok?1:.4; } }
  if(el.id==="acue") U.add.cue=el.value; if(el.id==="anote") U.add.note=el.value;
  if(el.id==="etext") U.edit.text=el.value; if(el.id==="ecue") U.edit.cue=el.value; if(el.id==="enote") U.edit.note=el.value;
  if(el.id==="elevel"){ U.edit.level=+el.value; render(); }
  if(el.id==="search"){ U.q=el.value; render(); }
});
document.getElementById("app").addEventListener("keydown",e=>{ if(e.target.id==="atext"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)) saveNew(); });
document.getElementById("app").addEventListener("change",e=>{ if(e.target.id==="bload"&&e.target.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.items) throw 0; S=mergeData(S,j); persist(); render(); toast("Backup loaded"); }catch(err){ toast("Not a Tip Cards backup"); } }; r.readAsText(e.target.files[0]); e.target.value=""; } });
function saveNew(){
  const a=U.add; if(!a.text.trim()) return;
  const cat=a.cat||guessCat(a.text)||LS.get("kc_lastcat","openers"), lvl=INTENTS[a.intent].lvl;
  const c={id:uid(),cat,text:a.text.trim(),cue:a.cue.trim(),note:(a.note||a.shared||"").trim(),level:lvl,due:addDays(today(),lvl===0?0:1),created:new Date().toISOString(),seen:0};
  LS.set("kc_lastcat",cat); U.add={text:"",cue:"",note:"",cat:null,auto:true,intent:a.intent,more:false}; U.queue=null;
  saveCard(c); render(); toast(`Saved to ${catOf(cat).emoji} ${catOf(cat).name}`); document.getElementById("atext")?.focus();
}

/* ================= start ================= */
(async()=>{
  oauthReturn();
  const qp=new URLSearchParams(location.search); // shared from YouTube etc.
  if(qp.has("url")||qp.has("text")||qp.has("title")){ const txt=[qp.get("title"),qp.get("text"),qp.get("url")].filter(Boolean).join(" ").trim();
    const url=(txt.match(/https?:\/\/\S+/)||[""])[0]; U.add.shared=url||txt; U.tab="add"; history.replaceState(null,"",REDIRECT+"#add"); }
  else { const h=location.hash.slice(1); if(TABS.includes(h)) U.tab=h; }
  try{ S=await DB.get("data")||emptyData(); }catch(e){ S=emptyData(); }
  const old=LS.get("kc_data",null); // cards from the first version
  if(old&&old.items){ const map={Dating:"flirt",Socializing:"openers",Chatting:"banter",Books:"books",Skills:"confidence"};
    S=mergeData(S,{items:old.items.map(c=>c.del?c:({...c,cat:map[c.cat]||"openers",upd:c.upd||Date.now()}))}); await DB.set("data",S); LS.del("kc_data"); }
  purgeStarter();
  render();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!linked()) return;
  if(!tok()&&navigator.onLine&&silentLogin()) return;
  sync();
  if(U.tab==="add") setTimeout(()=>document.getElementById("atext")?.focus(),80);
})();
</script>
